<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MetalTech RA</title>

    <!-- A-Frame primeiro, depois o MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <link rel="stylesheet" href="css/estilos.css" />
  </head>

  <body>
    <div id="status" class="procurando">Aponte a câmera para o marcador</div>
    <button id="botao-voz" type="button">🔇 Voz desligada</button>

    <div id="mira" class="oculto"></div>

    <div id="painel-sensor" class="oculto">
      <h2 id="painel-nome"></h2>
      <p id="painel-descricao"></p>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets/targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Os círculos dos sensores são criados pelo js/app.js dentro desta entidade -->
      <a-entity id="alvo-esteira" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script src="js/sensores.js"></script>
    <script src="js/app.js" defer></script>
  </body>
</html>

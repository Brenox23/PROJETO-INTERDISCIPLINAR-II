name: Testar e publicar imagem da API

# Roda os testes do back-end e publica a imagem Docker no GitHub Container Registry
# (ghcr.io), de onde o Azure Container Apps baixa a API.
on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - '.github/workflows/publicar-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGEM: ghcr.io/brenox23/metaltech-api

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Executar testes automatizados
        working-directory: back
        run: mvn -B test

  imagem:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./back
          push: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}

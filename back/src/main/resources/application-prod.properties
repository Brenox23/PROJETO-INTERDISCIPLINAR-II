# Valores vêm de variáveis de ambiente configuradas na nuvem
# Produção: PostgreSQL gerenciado (Neon). O driver é escolhido pela própria DB_URL,
# então o mesmo código também roda com MySQL (dev e docker-compose).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Poucas conexões (plano gratuito) e sem conexões paradas, para o banco poder "dormir"
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${PORT:8080}

# Senhas dos usuários iniciais: obrigatórias, vindas de variáveis de ambiente
app.seed.admin-senha=${ADMIN_SENHA}
app.seed.esteira-senha=${ESTEIRA_SENHA}
